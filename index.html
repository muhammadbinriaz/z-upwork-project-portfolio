<!doctype html>
<html lang="en" data-theme="hum-dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved === "hum" || saved === "hum-dark" ? saved : "hum-dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (meta) meta.setAttribute("content", theme === "hum-dark" ? "#1a1f28" : "#faf6ee");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="GoLeadFinder — Top Rated Plus B2B lead generation agency. Verified prospect lists, data enrichment, CRM cleanup, and automations delivered by a senior research team." />
    <meta name="keywords" content="B2B lead generation, contact research, prospect lists, data enrichment, CRM data cleaning, email list building, LinkedIn Sales Navigator, Apollo, Clay, HubSpot, GoLeadFinder" />
    <meta name="author" content="GoLeadFinder" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1f28" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1f28" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="GoLeadFinder — B2B Lead Generation & Contact Research" />
    <meta property="og:description" content="Top Rated Plus B2B agency on Upwork. 128+ projects delivered by our team. Verified prospect lists, data enrichment, and CRM cleanup with a 5.0 client rating." />
    <meta property="og:image" content="https://goleadfinder.com/og-image.jpg" />
